[tool.ruff]
exclude = ["migrations"]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
extend-select = ["UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
# NOTE: upstream gates at 87%. The scheduler/stats code this fork adds is now
# covered too; utils.py is what still keeps this below the upstream number.
addopts = "--cov django_dramatiq --cov-report term --cov-fail-under=80"

[tool.coverage.report]
omit = [
    "__init__.py",
    "django_dramatiq/setup.py",
    "*/migrations/*",
    "*/tests/*"
]
